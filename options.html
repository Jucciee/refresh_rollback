<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Refresh Rollback Options</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
    .setting-group { margin-bottom: 20px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input[type="number"], select, textarea { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { padding: 10px 15px; background-color: #4285f4; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #357ae8; }
    #status { margin-top: 10px; color: green; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Refresh Rollback Settings</h1>
  
  <div class="setting-group">
    <label for="maxStates">Maximum saved states per tab:</label>
    <input type="number" id="maxStates" min="1" max="50" value="5">
  </div>

  <div class="setting-group">
    <label for="filterMode">Operating Mode:</label>
    <select id="filterMode">
      <option value="blacklist">Blacklist (Work everywhere EXCEPT listed sites)</option>
      <option value="whitelist">Whitelist (Work ONLY on listed sites)</option>
    </select>
  </div>

  <div class="setting-group">
    <label for="filterSites">Target Sites (One domain per line, e.g., youtube.com):</label>
    <textarea id="filterSites" rows="5" placeholder="example.com&#10;youtube.com"></textarea>
  </div>

  <button id="saveBtn">Save Settings</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>

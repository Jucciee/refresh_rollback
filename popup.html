<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Refresh Rollback</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; width: 300px; padding: 10px; }
    h2 { margin-top: 0; font-size: 16px; border-bottom: 1px solid #ccc; padding-bottom: 5px; }
    .state-list { list-style-type: none; padding: 0; margin: 0; }
    .state-item { padding: 8px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: flex-start; }
    .state-item:hover { background-color: #f5f5f5; }
    .state-content { flex-grow: 1; cursor: pointer; }
    .state-actions { display: flex; flex-direction: column; gap: 4px; margin-left: 10px; }
    .action-btn { background: none; border: 1px solid #ccc; border-radius: 3px; font-size: 10px; cursor: pointer; padding: 2px 5px; color: #555; }
    .action-btn:hover { background: #eee; }
    .delete-btn:hover { background: #fee; color: red; border-color: #faa; }
    .state-time { font-size: 12px; color: #666; }
    .state-info { font-size: 14px; margin-top: 4px; }
    .youtube-badge { display: inline-block; background: #ff0000; color: white; font-size: 10px; padding: 2px 4px; border-radius: 3px; margin-left: 5px; }
    .special-label { display: inline-block; background: #4285f4; color: white; font-size: 10px; padding: 2px 4px; border-radius: 3px; margin-left: 5px; }
    .empty-state { color: #888; font-style: italic; text-align: center; padding: 20px 0; }
    .footer { margin-top: 15px; text-align: center; font-size: 12px; }
    .warning-text { color: #d93025; font-size: 11px; margin-bottom: 8px; line-height: 1.3; font-weight: bold; }
    a { color: #4285f4; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h2>Saved States</h2>
  <ul id="stateList" class="state-list">
    <div class="empty-state">Loading...</div>
  </ul>
  
  <div class="footer">
    <div class="warning-text">⚠️ 복구된 화면의 일부 버튼은 작동하지 않을 수 있습니다. (시각적 확인/읽기 전용 권장)</div>
    <p>Shortcut: <strong id="shortcutDisplay">Loading...</strong></p>
    <a href="#" id="optionsLink">Extension Options</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
